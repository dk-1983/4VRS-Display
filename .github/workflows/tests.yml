name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema==4.23.0 -r tools/requirements-release.txt
      - run: python -m unittest discover -s home_assistant/tests -v
      - run: python tools/test_release.py
