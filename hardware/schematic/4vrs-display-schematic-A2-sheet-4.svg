			<text x="80" y="307" style="font-family: Helvetica; font-size: 10px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,614) scale(1,-1)">Other TFT / ESP32 connections: sheet 1. Crossings without dots are not junctions.</text>
			<rect x="35" y="57" width="1120" height="210" style="stroke: rgb(72%,78%,81%); stroke-linecap: butt; stroke-width: 1; fill: none; fill-rule: evenodd;"/>
			<text x="47" y="245" style="font-family: Helvetica; font-size: 12px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,490) scale(1,-1)">11. ASSEMBLY - existing SD socket on our LCDWIKI display module</text>
			<text x="52" y="220" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,440) scale(1,-1)">Wire all FOUR SD header signals; the module does not internally connect them to the TFT SPI header.</text>
			<text x="52" y="200" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,400) scale(1,-1)">SD header contacts are identified by their silkscreen names; no unverified header pin order is implied.</text>
			<text x="52" y="180" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,360) scale(1,-1)">TFT_CS = GPIO13. SD_CS = GPIO25 (U1 module pad 10). Do not connect the two CS signals together.</text>
			<text x="52" y="160" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,320) scale(1,-1)">SD socket power and ground are internal to DS1; retain the module VCC/GND connection from sheet 1.</text>
			<text x="52" y="140" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,280) scale(1,-1)">All logic is 3.3 V. Keep SPI leads short. MISO is required for SD even without TFT readback diagnostics.</text>
			<text x="52" y="120" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,240) scale(1,-1)">Firmware 1.0.0 uses a shared SPI bus, MISO pull-up and separate CS handling; SD starts at 1 MHz.</text>
			<text x="52" y="100" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,200) scale(1,-1)">Use a FAT32 card; 16 GB microSD with a full-size SD adapter has been tested. No automatic formatting.</text>
			<text x="52" y="80" style="font-family: Helvetica; font-size: 11px;fill: rgb(9%,20%,29%); stroke:none;" transform="translate(0,160) scale(1,-1)">This sheet shows the existing module socket, not a wiring diagram for an arbitrary bare SD socket.</text>
